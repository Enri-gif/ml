<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TensorFlow.js Frontend Lab</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis@latest"></script>

    <style>
        body { display: flex; min-height: 100vh; flex-direction: column; }
        main { flex: 1 0 auto; }
        pre { padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<main>
    <div class="section no-pad-bot" id="index-banner">
        <div class="container">
            <h5 class="header center blue-text small">Linear regression with TensorFlow.js</h5>
            <div class="row center">
                <h6 class="header col s12 light">Train a model to predict concrete strength from age.</h6>
            </div>
        </div>
    </div>

    <div class="section no-pad-bot light-blue lighten-4">
        <div class="container">
            <div class="row center">
                <br/>
                <button id="toggle-button" class="waves-effect waves-light light-blue btn-small">
                    Toggle Visor
                </button>
                <br/><br/>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="section">
            <div class="row">
                
                <div class="col s12 m6">
                    <div class="icon-block">
                        <h3 class="center light-blue-text"><i class="material-icons" style="font-size: 2em">build</i></h3>
                        <h5 class="center">Train & Test</h5>

                        <p class="light"></p>

                        <div>
                            <p><label>Training status:</label></p>
                            <pre class="grey lighten-4" style="overflow-x: auto"><em id="model-status">Loading data...</em></pre>

                            <p><label>Testing status:</label></p>
                            <pre class="grey lighten-4" style="overflow-x: auto"><em id="testing-status">Not yet tested</em></pre>

                            <button autocomplete="off" id="train-button" class="waves-effect light-blue waves-light btn">
                                Train New Model
                            </button>
                            <button autocomplete="off" id="test-button" class="waves-effect light-blue waves-light btn">
                                Test Model
                            </button>
                        </div>
                        <br/>

                        <div>
                            <button autocomplete="off" id="load-button" class="waves-effect light-blue waves-light btn-small">
                                Load Model
                            </button>
                            <button autocomplete="off" id="save-button" class="waves-effect light-blue waves-light btn-small">
                                Save Model
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col s12 m6">
                    <div class="icon-block">
                        <h3 class="center light-blue-text"><i class="material-icons" style="font-size: 2em">timeline</i></h3>
                        <h5 class="center">Predict</h5>

                        <div class="input-field">
                            <input type="number" id="prediction-input-1" placeholder="0.5" step="0.01">
                            <label class="active">age</label>
                        </div>
                        
                        <button autocomplete="off" id="predict-button" class="waves-effect light-blue waves-light btn">
                            Predict concrete strength
                        </button>
                        <p><strong id="prediction-output"></strong></p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script type="module" src="index.js"></script>

</body>
</html>
